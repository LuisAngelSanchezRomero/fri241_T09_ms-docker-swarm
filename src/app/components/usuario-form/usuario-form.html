<div class="container">
  <div class="form-container">
    <h1>{{ isEditMode ? ' Editar Usuario' : ' Nuevo Usuario' }}</h1>
    
    <form [formGroup]="usuarioForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombre">Nombre *</label>
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          class="form-control"
          [class.is-invalid]="usuarioForm.get('nombre')?.invalid && usuarioForm.get('nombre')?.touched"
        />
        <div class="invalid-feedback" *ngIf="usuarioForm.get('nombre')?.errors?.['required'] && usuarioForm.get('nombre')?.touched">
          El nombre es obligatorio
        </div>
        <div class="invalid-feedback" *ngIf="usuarioForm.get('nombre')?.errors?.['minlength']">
          El nombre debe tener al menos 2 caracteres
        </div>
        <div class="invalid-feedback" *ngIf="usuarioForm.get('nombre')?.errors?.['maxlength']">
          El nombre no puede exceder 100 caracteres
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico *</label>
        <input
          type="email"
          id="correo"
          formControlName="correo"
          class="form-control"
          [class.is-invalid]="usuarioForm.get('correo')?.invalid && usuarioForm.get('correo')?.touched"
        />
        <div class="invalid-feedback" *ngIf="usuarioForm.get('correo')?.errors?.['required'] && usuarioForm.get('correo')?.touched">
          El correo es obligatorio
        </div>
        <div class="invalid-feedback" *ngIf="usuarioForm.get('correo')?.errors?.['email']">
          Ingresa un correo válido
        </div>
        <div class="invalid-feedback" *ngIf="usuarioForm.get('correo')?.errors?.['maxlength']">
          El correo no puede exceder 150 caracteres
        </div>
      </div>

      <div class="error-message" *ngIf="error">
         {{ error }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/usuarios">
          Cancelar
        </button>
        <button type="submit" class="btn-submit" [disabled]="loading">
          {{ loading ? 'Procesando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
