version: "3.8"

services:

  mongo:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db
    networks:
      - ms-net

  api:
    image: usuario-service
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: usuarios_db
      MONGO_USERNAME: admin
      MONGO_PASSWORD: admin123
    networks:
      - ms-net
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

networks:
  ms-net:

volumes:
  mongo-data: